spring:
  application:
    name: scarlet-nexus
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/scarlet_nexus}
    username: ${DATABASE_USERNAME:scarlet}
    password: ${DATABASE_PASSWORD:}
    hikari:
      connection-timeout: 2000
      maximum-pool-size: 5
  flyway:
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
  jackson:
    time-zone: UTC
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
mybatis:
  type-handlers-package: dev.scarletnexus.common
app:
  bootstrap:
    email: ${ADMIN_EMAIL:}
    password-file: ${ADMIN_PASSWORD_FILE:}
  login:
    attempts-per-window: 10
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    dev.scarletnexus.identity: INFO
  pattern:
    level: '%5p [requestId=%X{requestId:-}]'
