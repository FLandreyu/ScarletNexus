log_format safe_tls_access 'requestId=$request_id method=$request_method status=$status duration=$request_time';
limit_req_zone $binary_remote_addr zone=login_tls:1m rate=10r/m;

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /dev/stdout safe_tls_access;
    # Request-scoped nginx errors can contain a private URI/query string.
    error_log /dev/stderr crit;
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:TLS:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security 'max-age=86400' always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # This gateway terminates TLS directly. No client forwarding header is trusted.
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Forwarded '';
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host '';
    proxy_set_header X-Forwarded-Port '';
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_connect_timeout 5s;
    proxy_read_timeout 130s;
    proxy_buffering off;
    proxy_cache off;

    location = /api/v1/auth/login {
        limit_req zone=login_tls burst=9 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
    }
    location /api/ {
        proxy_pass http://backend:8080;
    }
    location /actuator/ { return 404; }
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

# Only container-loopback HTTP is retained for the existing read-only monitor.
# Port 80 is not published and no private route is served here.
server {
    listen 127.0.0.1:80;
    server_name _;
    server_tokens off;
    access_log off;
    location = /api/v1/system/status {
        proxy_pass http://backend:8080;
        proxy_set_header X-Request-ID $request_id;
    }
    location / { return 404; }
}
