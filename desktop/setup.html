<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="setup.css" />
    <title>Scarlet Nexus · 首次设置</title>
  </head>
  <body>
    <main>
      <p class="brand">SCARLET NEXUS</p>
      <h1>创建你的学习空间</h1>
      <p>
        学习记录保存在这台电脑上。请设置自己的登录账号，软件不会提供默认密码。
      </p>
      <form id="setup-form">
        <label for="email">邮箱</label>
        <input
          id="email"
          type="email"
          autocomplete="username"
          maxlength="254"
          required
        />
        <label for="password">密码</label>
        <input
          id="password"
          type="password"
          autocomplete="new-password"
          minlength="12"
          maxlength="72"
          required
        />
        <label for="confirmation">确认密码</label>
        <input
          id="confirmation"
          type="password"
          autocomplete="new-password"
          required
        />
        <p class="hint">
          至少12个字符，最多72个UTF-8字节。请妥善保管，当前不支持找回密码。
        </p>
        <p id="status" role="status" aria-live="polite"></p>
        <button id="submit" type="submit">创建学习空间</button>
      </form>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
