name: scarlet-nexus
x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
services:
  db:
    logging: *bounded-logging
    image: postgres:17.12-alpine3.24@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    command: ['postgres', '-c', 'log_error_verbosity=terse', '-c', 'log_min_error_statement=panic']
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scarlet_nexus}
      POSTGRES_USER: ${POSTGRES_USER:-scarlet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    logging: *bounded-logging
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-scarlet_nexus}
      DATABASE_USERNAME: ${POSTGRES_USER:-scarlet}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SERVER_ADDRESS: 0.0.0.0
      API_DOCS_ENABLED: 'false'
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD_FILE: ${ADMIN_PASSWORD_FILE:-}
    volumes:
      - ./.runtime/dev-secrets:/run/secrets:ro
      - attachments-data:/var/lib/scarlet/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/actuator/health/readiness || exit 1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped
  web:
    logging: *bounded-logging
    build: ./frontend
    ports:
      - '127.0.0.1:${WEB_PORT:-8088}:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
  attachments-data:
