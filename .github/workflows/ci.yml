name: Quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify -Ptestcontainers
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-reports
          path: backend/target/*-reports/
  compose-and-browser:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [desktop, mobile]
        transport: [http, tls]
    env:
      POSTGRES_PASSWORD: ci-disposable-database-only
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8088
      ADMIN_EMAIL: ci-acceptance@example.test
      ADMIN_PASSWORD_FILE: /run/secrets/admin.password
      E2E_EMAIL: ci-acceptance@example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare isolated acceptance credentials
        run: |
          mkdir -p .runtime/dev-secrets
          python3 - <<'PY'
          import os, pathlib, secrets
          password = secrets.token_urlsafe(32)
          pathlib.Path('.runtime/dev-secrets/admin.password').write_text(password)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('E2E_PASSWORD=' + password + '\n')
          PY
      - name: Prepare disposable TLS trust
        if: matrix.transport == 'tls'
        run: |
          umask 077
          mkdir -p .runtime/tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj /CN=localhost \
            -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1' \
            -keyout .runtime/tls/key.pem -out .runtime/tls/cert.pem
          pin=$(openssl x509 -in .runtime/tls/cert.pem -pubkey -noout | openssl pkey -pubin -outform DER | openssl dgst -sha256 -binary | openssl base64 -A)
          {
            echo 'COMPOSE_FILE=docker-compose.yml:docker-compose.tls.yml'
            echo 'TLS_CERT_FILE=./.runtime/tls/cert.pem'
            echo 'TLS_KEY_FILE=./.runtime/tls/key.pem'
            echo 'PLAYWRIGHT_BASE_URL=https://localhost:8443'
            echo "CURL_CA_BUNDLE=$PWD/.runtime/tls/cert.pem"
            echo "NODE_EXTRA_CA_CERTS=$PWD/.runtime/tls/cert.pem"
            echo "E2E_TLS_SPKI=$pin"
          } >> "$GITHUB_ENV"
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 240
      - name: Check gateway and restart persistence
        run: |
          curl --fail "$PLAYWRIGHT_BASE_URL/" | grep 'Scarlet Nexus'
          curl --fail "$PLAYWRIGHT_BASE_URL/api/v1/system/status" | grep '"schemaVersion":"12"'
          docker compose restart backend
          for attempt in $(seq 1 60); do
            if curl --fail --silent "$PLAYWRIGHT_BASE_URL/api/v1/system/status" > /tmp/status.json; then break; fi
            sleep 2
          done
          grep '"database":"UP"' /tmp/status.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e -- --project=${{ matrix.browser }} --config=${{ matrix.transport == 'tls' && 'playwright.tls.config.ts' || 'playwright.config.ts' }}
        working-directory: frontend
      - name: TLS security, gateway stream and resources
        if: matrix.transport == 'tls'
        run: |
          python3 scripts/verify_tls.py --base-url "$PLAYWRIGHT_BASE_URL" --ca-file .runtime/tls/cert.pem --email "$E2E_EMAIL" --password-file .runtime/dev-secrets/admin.password
          python3 scripts/verify_tls_runtime.py --project scarlet-nexus
          python3 scripts/operations.py monitor --project scarlet-nexus
          python3 scripts/operations.py attachments --project scarlet-nexus
          python3 scripts/verify_tls_stream.py --ca-file .runtime/tls/cert.pem --key-file .runtime/tls/key.pem --web-image "$(docker compose images -q web)"
      - name: Encrypted backup and isolated restore drill
        if: matrix.transport == 'http'
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/operations.py monitor --project scarlet-nexus
          python3 scripts/operations.py attachments --project scarlet-nexus
          python3 - <<'PY'
          import pathlib, secrets
          pathlib.Path('.runtime/backup.key').write_text(secrets.token_urlsafe(48))
          PY
          python3 scripts/backup_restore.py backup --project scarlet-nexus --password-file .runtime/backup.key --output .runtime/ci-backup.snb
          python3 scripts/backup_restore.py verify --password-file .runtime/backup.key --input .runtime/ci-backup.snb
          python3 scripts/backup_restore.py drill --password-file .runtime/backup.key --input .runtime/ci-backup.snb --login-email "$E2E_EMAIL" --login-password-file .runtime/dev-secrets/admin.password
      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-and-compose-${{ matrix.transport }}-${{ matrix.browser }}
          path: |
            frontend/test-results/
            frontend/playwright-report/
            compose.log
      - run: docker compose down
        if: always()
