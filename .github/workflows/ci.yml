name: P0 quality gates
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify -Ptestcontainers
        working-directory: backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-reports
          path: backend/target/*-reports/
  compose-and-browser:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-disposable-database-only
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8088
      ADMIN_EMAIL: ci-acceptance@example.test
      ADMIN_PASSWORD_FILE: /run/secrets/admin.password
      E2E_EMAIL: ci-acceptance@example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare isolated acceptance credentials
        run: |
          mkdir -p .runtime/dev-secrets
          python3 - <<'PY'
          import os, pathlib, secrets
          password = secrets.token_urlsafe(32)
          pathlib.Path('.runtime/dev-secrets/admin.password').write_text(password)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('E2E_PASSWORD=' + password + '\n')
          PY
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 240
      - name: Check gateway and restart persistence
        run: |
          curl --fail http://127.0.0.1:8088/ | grep 'Scarlet Nexus'
          curl --fail http://127.0.0.1:8088/api/v1/system/status | grep '"schemaVersion":"5"'
          docker compose restart backend
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8088/api/v1/system/status > /tmp/status.json; then break; fi
            sleep 2
          done
          grep '"database":"UP"' /tmp/status.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-and-compose
          path: |
            frontend/test-results/
            frontend/playwright-report/
            compose.log
      - run: docker compose down
        if: always()
